---
name: Docker build

on: [push]

env:
  NODE_VERSION: 20.x

jobs:
  pre-build-stage:
    name: Static check code and small tests
    runs-on: ubuntu-latest
    steps:
      - name: test
        run: echo ${{env.NODE_VERSION}}
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"
      - name: install
        run: yarn install

      - name: Typescript check
        run: yarn typecheck

      - name: Lint code
        run: yarn lint

      - name: Run small tests
        run: yarn test

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"

      - name: Security audit
        run: yarn audit

  performance-tests:
    name: Performance tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"
      - name: Run performance tests
        run: ./reassure-tests.sh

  build-stage:
    name: Build docker container
    runs-on: ubuntu-latest
    needs: [pre-build-stage]
    timeout-minutes: 180
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: t1mon1106/scheduler_client

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }},t1mon1106/scheduler_client:latest
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Docker image tests
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            BACKEND_ROUTE=http://frontend/api/v1
            NGINX_CONFIG_PATH=nginx-test.conf
          tags: ${{ steps.meta.outputs.tags }}-tests
          labels: ${{ steps.meta.outputs.labels }}

  large-tests:
    name: Large tests
    runs-on: ubuntu-latest
    needs: [build-stage]

    container:
      image: ruby:bookworm

    strategy:
      fail-fast: false
      matrix:
        browser: ["chrome", "firefox"]
        command: ["spec/test_resolutions*", "spec/test_basic*"]

    services:
      selenium:
        image: selenium/standalone-${{ matrix.browser }}
        options: --shm-size=2gb

      postgres:
        image: postgres:16.2-alpine3.18
        env:
          POSTGRES_DB: "schedulerdb"
          POSTGRES_USER: "scheduler"
          POSTGRES_PASSWORD: "scheduler"
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis-db:
        image: redis:8.2.1-alpine
        ports:
          - 6379:6379

      backend:
        image: t1mon1106/scheduler:main
        ports:
          - 8080:8080
        env:
          RUST_LOG: info
          PASETO_KEY: "RANDOM WORDS WINTER MACINTOSH PC"
          PORT: 8080
          DATABASE_PASSWORD: scheduler
          DATABASE_USER: scheduler
          DATABASE_PORT: 5432
          DATABASE_DB: schedulerdb
          DATABASE_HOST: postgres
          CACHE_HOST: redis-db
          CACHE_PORT: 6379

      frontend:
        image: t1mon1106/scheduler_client:${{ github.ref_name }}-tests
        ports:
          - 80:80

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Prepare
        run: cd tests/large_tests && gem install bundler && bundle install
      - name: Tests
        env:
          BROWSER: ${{ matrix.browser }}
          GRID: true
          GRID_URL: http://selenium:4444
          BASE_URL: http://frontend
        run: cd tests/large_tests && rspec ${{ matrix.command }} --format doc

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artifacts-${{ github.job }}-${{ matrix.browser }}
          path: tests/large_tests/result
